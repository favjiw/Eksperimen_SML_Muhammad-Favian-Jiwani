name: Automated Data Preprocessing

on:
  push:
    branches:
      - main
    paths:
      - 'diabetes_raw/**'
      - 'preprocessing/automate-Muhammad-Favian-Jiwani.py'
  workflow_dispatch:

jobs:
  preprocess_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn
          
      - name: Run preprocessing automation script
        run: |
          cd preprocessing
          python automate-Muhammad-Favian-Jiwani.py
          
      - name: Commit and Push cleaned data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add preprocessing/diabetes_preprocessing/cleaned_diabetes_data.csv
          git commit -m "Automated preprocessing: Update cleaned dataset" || echo "No changes to commit"
          git push